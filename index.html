<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CPAT Supervisory Tracker</title>
  <style>:root{--primary:#2563eb;--danger:#dc2626;--warn:#d97706;--success:#16a34a;--ongoing:#0891b2;--bg:#f1f5f9;--surface:#fff;--border:#e2e8f0;--text:#1e293b;--muted:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
.hidden{display:none!important}

/* Login */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1e3a5f,#2563eb)}
.login-card{background:var(--surface);border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.15);padding:48px 40px;text-align:center;max-width:380px;width:100%}
.login-card h1{font-size:1.4rem;margin-bottom:8px;color:var(--primary)}
.login-card p{color:var(--muted);margin-bottom:28px;font-size:.9rem;line-height:1.5}
#login-error{color:var(--danger);margin-top:12px;font-size:.85rem}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;border:1.5px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-size:.93rem;font-weight:500;color:var(--text);transition:box-shadow .15s}
.btn-google:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.btn-google svg{flex-shrink:0}

/* App shell */
#app{display:flex;flex-direction:column;min-height:100vh}
header{background:var(--primary);color:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:54px;position:sticky;top:0;z-index:100;box-shadow:0 2px 6px rgba(0,0,0,.2)}
header h1{font-size:1rem;font-weight:700}
.header-right{display:flex;align-items:center;gap:14px}
#user-email{font-size:.78rem;opacity:.8}
.btn-signout{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:4px 11px;border-radius:6px;cursor:pointer;font-size:.78rem}
.btn-signout:hover{background:rgba(255,255,255,.25)}

/* Tabs */
#tab-nav{background:#fff;border-bottom:2px solid var(--border);display:flex;overflow-x:auto;position:sticky;top:54px;z-index:90;scrollbar-width:none}
#tab-nav::-webkit-scrollbar{display:none}
.tab-btn{padding:11px 15px;border:none;background:none;cursor:pointer;font-size:.82rem;font-weight:500;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .15s,border-color .15s}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab-btn.has-overdue{color:var(--danger)}
.tab-btn.has-overdue.active{border-bottom-color:var(--danger)}

/* Content */
#tab-content{padding:24px;max-width:1100px;margin:0 auto;width:100%}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:28px}
.stat-card{background:var(--surface);border-radius:10px;padding:18px 20px;border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stat-val{font-size:2rem;font-weight:700;margin-bottom:4px}
.stat-lbl{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat-overdue .stat-val{color:var(--danger)}
.stat-upcoming .stat-val{color:var(--warn)}
.stat-primary .stat-val{color:var(--primary)}

/* Overview attorney rows */
.overview-card{background:var(--surface);border-radius:10px;border:1px solid var(--border);margin-bottom:14px;overflow:hidden}
.overview-card-hdr{padding:11px 18px;background:#f8fafc;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.overview-card-hdr h3{font-size:.92rem;font-weight:600}
.badge-row{display:flex;gap:6px;align-items:center}
.badge{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.04em}
.badge-overdue{background:#fef2f2;color:var(--danger);border:1px solid #fecaca}
.badge-upcoming{background:#fffbeb;color:var(--warn);border:1px solid #fde68a}
.badge-ok{background:#f0fdf4;color:var(--success);border:1px solid #bbf7d0}
.overview-matters{padding:8px 18px}
.ov-row{display:flex;align-items:baseline;gap:12px;padding:5px 0;border-bottom:1px solid var(--border);font-size:.86rem}
.ov-row:last-child{border-bottom:none}
.ov-name{font-weight:500;flex:1}
.ov-meta{font-size:.78rem;color:var(--muted)}
.ov-also{font-size:.73rem;color:var(--ongoing);font-style:italic}

/* Attorney tab */
.atty-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.atty-hdr h2{font-size:1.2rem;font-weight:700}
.btn{padding:6px 13px;border-radius:6px;border:none;cursor:pointer;font-size:.8rem;font-weight:500;transition:opacity .15s}
.btn-primary{background:var(--primary);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-sm{padding:4px 10px;font-size:.75rem}
.btn:hover{opacity:.85}

/* Matter card */
.matter-card{background:var(--surface);border-radius:10px;border:1px solid var(--border);margin-bottom:18px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.matter-hdr{padding:11px 16px;background:#f8fafc;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.matter-name{font-weight:700;font-size:.93rem;flex:1}
.matter-also{font-size:.7rem;color:var(--ongoing);background:#ecfeff;border:1px solid #a5f3fc;padding:2px 8px;border-radius:10px;font-style:italic}
.matter-actions{display:flex;gap:6px}

/* Task table */
.task-table{width:100%;border-collapse:collapse}
.task-table th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:7px 12px;border-bottom:1px solid var(--border);background:#fafafa}
.task-table td{padding:8px 12px;border-bottom:1px solid #f1f5f9;vertical-align:top}
.task-table tr:last-child td{border-bottom:none}
.task-row:hover td{background:#f8fafc}
.task-row.is-done td{background:#fafafa}
.task-row.is-done .task-desc{font-style:italic;text-decoration:line-through;color:var(--muted)}
.task-checkbox{width:15px;height:15px;cursor:pointer;accent-color:var(--primary);margin-top:2px}
.task-desc{font-size:.86rem;line-height:1.4}
.task-date{font-size:.8rem;white-space:nowrap;color:var(--muted)}
.task-date.overdue{color:var(--danger);font-weight:600}
.task-date.upcoming{color:var(--warn);font-weight:600}
.task-date.done-date{color:var(--success)}
.task-notes{font-size:.78rem;color:#475569;line-height:1.4}
.task-actions{display:flex;gap:3px;white-space:nowrap}
.icon-btn{background:none;border:none;cursor:pointer;padding:3px 5px;border-radius:4px;color:var(--muted);font-size:.82rem}
.icon-btn:hover{background:var(--bg);color:var(--text)}
.icon-btn.del:hover{background:#fef2f2;color:var(--danger)}
.ongoing-pill{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:10px;background:#ecfeff;color:var(--ongoing);border:1px solid #a5f3fc;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.done-pill{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:10px;background:#f0fdf4;color:var(--success);border:1px solid #bbf7d0}
.done-divider{padding:5px 12px;background:#f8fafc;font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;border-top:1px solid var(--border)}
.add-task-btn{background:none;border:1px dashed var(--border);color:var(--muted);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.78rem;width:100%;transition:border-color .15s,color .15s}
.add-task-btn:hover{border-color:var(--primary);color:var(--primary)}

/* Manage tab */
.manage-row{display:flex;align-items:center;padding:11px 16px;border-bottom:1px solid var(--border)}
.manage-row:last-child{border-bottom:none}

/* Modals */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;padding:26px;width:100%;max-width:460px;box-shadow:0 8px 40px rgba(0,0,0,.18);max-height:90vh;overflow-y:auto}
.modal h2{font-size:1.05rem;font-weight:700;margin-bottom:18px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.form-group input,.form-group textarea{width:100%;padding:8px 11px;border:1.5px solid var(--border);border-radius:7px;font-size:.88rem;font-family:inherit;color:var(--text);transition:border-color .15s}
.form-group input:focus,.form-group textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.form-group textarea{min-height:75px;resize:vertical}
.check-row{display:flex;align-items:center;gap:8px;font-size:.875rem;cursor:pointer;padding:3px 0}
.check-row input{width:auto;cursor:pointer}
.check-list{display:flex;flex-direction:column;gap:4px;max-height:160px;overflow-y:auto;border:1.5px solid var(--border);border-radius:7px;padding:6px 10px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

/* Empty / misc */
.empty-state{text-align:center;padding:40px;color:var(--muted);font-size:.88rem}
@media(max-width:640px){#tab-content{padding:14px};header h1{font-size:.9rem};#user-email{display:none}}</style>
</head>
<body>

<div id="login-screen"><div class="login-card">
    <h1>⚖️ CPAT Supervisory Tracker</h1>
    <p>Sign in with your authorized Google account to access attorney matter tracking.</p>
    <button class="btn-google" id="btn-signin">
      <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Sign in with Google
    </button>
    <p id="login-error"></p>
  </div></div>
<div id="app" class="hidden"><header>
    <h1>CPAT Supervisory Tracker</h1>
    <div class="header-right">
      <span id="user-email"></span>
      <button class="btn-signout" id="btn-signout">Sign Out</button>
    </div>
  </header>
  <nav id="tab-nav"></nav>
  <div id="tab-content"><div class="empty-state">Loading…</div></div></div>
<div id="modal-attorney" class="modal-overlay hidden"><div class="modal">
    <h2 id="matty-title">Add Attorney</h2>
    <div class="form-group"><label>Name</label><input id="matty-name" type="text" placeholder="Full name" /></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-attorney')">Cancel</button>
      <button class="btn btn-primary" id="matty-save">Save</button>
    </div>
  </div></div>
<div id="modal-matter" class="modal-overlay hidden"><div class="modal">
    <h2 id="mmatter-title">Add Matter</h2>
    <div class="form-group"><label>Matter Name</label><input id="mmatter-name" type="text" placeholder="e.g. Data Breach Investigation" /></div>
    <div class="form-group"><label>Also assign to (shared)</label><div class="check-list" id="mmatter-attys"></div></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-matter')">Cancel</button>
      <button class="btn btn-primary" id="mmatter-save">Save</button>
    </div>
  </div></div>
<div id="modal-task" class="modal-overlay hidden"><div class="modal">
    <h2 id="mtask-title">Add Task</h2>
    <div class="form-group"><label>Description</label><input id="mtask-desc" type="text" placeholder="What needs to be done?" /></div>
    <div class="form-group"><label>Due Date</label><input id="mtask-date" type="date" /></div>
    <div class="form-group"><label>Notes</label><textarea id="mtask-notes" placeholder="Any relevant context…"></textarea></div>
    <div class="form-group">
      <label class="check-row"><input type="checkbox" id="mtask-ongoing" /> Ongoing / repeating task (no completion checkbox)</label>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-task')">Cancel</button>
      <button class="btn btn-primary" id="mtask-save">Save</button>
    </div>
  </div></div>
<div id="modal-confirm" class="modal-overlay hidden"><div class="modal" style="max-width:360px;text-align:center">
    <h2 id="mconfirm-title">Confirm Delete</h2>
    <p id="mconfirm-msg" style="color:var(--muted);font-size:.875rem;margin-bottom:20px"></p>
    <div class="modal-footer" style="justify-content:center">
      <button class="btn btn-ghost" onclick="closeModal('modal-confirm')">Cancel</button>
      <button class="btn btn-danger" id="mconfirm-ok">Delete</button>
    </div>
  </div></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>// ── CONFIGURATION ─────────────────────────────────────────────
// Fill these in after creating your Firebase project.
const FIREBASE_CONFIG = {
  apiKey:            "YOUR_API_KEY",
  authDomain:        "YOUR_PROJECT_ID.firebaseapp.com",
  projectId:         "YOUR_PROJECT_ID",
  storageBucket:     "YOUR_PROJECT_ID.appspot.com",
  messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
  appId:             "YOUR_APP_ID"
};
// Only this Google account email can sign in.
const AUTHORIZED_EMAIL = "YOUR_EMAIL@EXAMPLE.COM";

// ── INIT ──────────────────────────────────────────────────────
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db   = firebase.firestore();

// ── STATE ─────────────────────────────────────────────────────
let attorneys = {};  // { id: { name, order } }
let matters   = {};  // { id: { name, attorneyIds[], order } }
let tasks     = {};  // { id: { matterId, description, dueDate, isOngoing, completed, completedDate, notes, order } }
let activeTab = 'overview';
let listeners = [];
let seeded    = false;

// ── AUTH ──────────────────────────────────────────────────────
document.getElementById('btn-signin').onclick = () =>
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
      .catch(e => { document.getElementById('login-error').textContent = e.message; });

document.getElementById('btn-signout').onclick = () => {
  listeners.forEach(fn => fn()); listeners = [];
  auth.signOut();
};

auth.onAuthStateChanged(user => {
  if (user) {
    if (AUTHORIZED_EMAIL !== "YOUR_EMAIL@EXAMPLE.COM" && user.email !== AUTHORIZED_EMAIL) {
      document.getElementById('login-error').textContent = 'Access denied: unauthorized account.';
      auth.signOut(); return;
    }
    document.getElementById('user-email').textContent = user.email;
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    startListeners();
  } else {
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('app').classList.add('hidden');
  }
});

// ── FIRESTORE LISTENERS ───────────────────────────────────────
function startListeners() {
  listeners.push(
    db.collection('attorneys').onSnapshot(snap => {
      attorneys = {};
      snap.forEach(d => { attorneys[d.id] = d.data(); });
      if (!seeded) { seeded = true; seedIfEmpty(); }
      render();
    }),
    db.collection('matters').onSnapshot(snap => {
      matters = {};
      snap.forEach(d => { matters[d.id] = d.data(); });
      render();
    }),
    db.collection('tasks').onSnapshot(snap => {
      tasks = {};
      snap.forEach(d => { tasks[d.id] = d.data(); });
      render();
    })
  );
}

// ── SEED ──────────────────────────────────────────────────────
async function seedIfEmpty() {
  if (Object.keys(attorneys).length > 0) return;

  function xl(serial) { // Excel serial → ISO date string
    if (!serial) return null;
    return new Date((serial - 25569) * 86400 * 1000).toISOString().slice(0, 10);
  }

  const batch = db.batch();
  const NAMES = ['Jill Abrams','Sarah Aceves','Merideth Chaudoir','Rose Kennedy',
    'Rizlaine Sabiani','Justin Sherman','Alex Spring','Andre Souligny',
    'Jonathan Goddard','Gabriela Ferrari'];
  const aIds = {};
  NAMES.forEach((name, i) => {
    const r = db.collection('attorneys').doc(); aIds[name] = r.id;
    batch.set(r, { name, order: i });
  });

  const jId = aIds['Jonathan Goddard'];
  const MATTERS = [
    { name:'Tobacco', tasks:[
      { description:'2 Desk Audits', dueDate:null, isOngoing:false, completed:true, completedDate:xl(46119), notes:'(Date may have been earlier, this is when we discussed)' },
      { description:'Tobacco Certifications Begin', dueDate:xl(46142), isOngoing:false, completed:false, completedDate:null, notes:'' }
    ]},
    { name:'Data Breach', tasks:[
      { description:'(3x Weekly) Data Breach Notice Report Processing', dueDate:null, isOngoing:true, completed:false, completedDate:null, notes:'' },
      { description:'(Daily) Data Breach Email Review', dueDate:null, isOngoing:true, completed:false, completedDate:null, notes:'' },
      { description:'Data Breach table - assess project first steps', dueDate:xl(46127), isOngoing:false, completed:false, completedDate:null, notes:'' },
      { description:'Data Breach table - Process Complete', dueDate:xl(46136), isOngoing:false, completed:false, completedDate:null, notes:'' },
      { description:'Update data breach webpage re affirmation for 14-day exemption', dueDate:xl(46172), isOngoing:false, completed:false, completedDate:null, notes:'(Not a priority, to be handled sometime after data breach tables)' }
    ]},
    { name:'Meta - Scams', tasks:[
      { description:'Document review - first 50', dueDate:xl(46129), isOngoing:false, completed:false, completedDate:null, notes:'(Sent guidance and initial assignment on 4/8)' },
      { description:'Document review - full', dueDate:xl(46157), isOngoing:false, completed:false, completedDate:null, notes:'' }
    ]},
    { name:'Plastics', tasks:[
      { description:'Something with Meghan and Natalie, TBD', dueDate:null, isOngoing:false, completed:false, completedDate:null, notes:'' }
    ]},
    { name:'FCA', tasks:[
      { description:'Did a project for Jill previously, unclear whether further work will be required', dueDate:null, isOngoing:false, completed:false, completedDate:null, notes:'' }
    ]},
    { name:'Casella', tasks:[
      { description:'Research project for Sarah re Casella acquisitions, possible antitrust', dueDate:null, isOngoing:false, completed:false, completedDate:null, notes:'Assigned 4/8, no ETA' }
    ]}
  ];

  let mo = 0;
  for (const m of MATTERS) {
    const mr = db.collection('matters').doc();
    batch.set(mr, { name: m.name, attorneyIds: [jId], order: mo++ });
    let to = 0;
    for (const t of m.tasks) batch.set(db.collection('tasks').doc(), { matterId: mr.id, ...t, order: to++ });
  }
  await batch.commit();
}

// ── HELPERS ───────────────────────────────────────────────────
function todayISO()      { return new Date().toISOString().slice(0,10); }
function weekISO()       { const d=new Date(); d.setDate(d.getDate()+7); return d.toISOString().slice(0,10); }
function fmtDate(iso)    { if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${m}/${d}/${y}`; }
function esc(s)          { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function sortedAttorneys(){ return Object.entries(attorneys).sort((a,b)=>(a[1].order??0)-(b[1].order??0)); }
function mattersFor(aId) { return Object.entries(matters).filter(([,m])=>m.attorneyIds?.includes(aId)).sort((a,b)=>(a[1].order??0)-(b[1].order??0)); }
function tasksFor(mId)   { return Object.entries(tasks).filter(([,t])=>t.matterId===mId).sort((a,b)=>(a[1].order??0)-(b[1].order??0)); }

function taskDateClass(t) {
  if (t.completed||t.isOngoing||!t.dueDate) return '';
  const today=todayISO(), week=weekISO();
  if (t.dueDate < today) return 'overdue';
  if (t.dueDate <= week) return 'upcoming';
  return '';
}
function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
document.querySelectorAll('.modal-overlay').forEach(o => o.addEventListener('click', e => { if(e.target===o) o.classList.add('hidden'); }));

// ── RENDER ────────────────────────────────────────────────────
function render() { renderTabs(); renderContent(); }

function renderTabs() {
  const today=todayISO(), nav=document.getElementById('tab-nav');
  let html = `<button class="tab-btn${activeTab==='overview'?' active':''}" onclick="setTab('overview')">Overview</button>`;
  for (const [id, a] of sortedAttorneys()) {
    const overdueCount = mattersFor(id).flatMap(([mid])=>tasksFor(mid))
      .filter(([,t])=>!t.completed&&!t.isOngoing&&t.dueDate&&t.dueDate<today).length;
    const cls = `tab-btn${activeTab===id?' active':''}${overdueCount?' has-overdue':''}`;
    html += `<button class="${cls}" onclick="setTab('${id}')" title="${esc(a.name)}">${esc(a.name)}</button>`;
  }
  html += `<button class="tab-btn${activeTab==='__manage'?' active':''}" onclick="setTab('__manage')" style="margin-left:auto;color:var(--muted)">⚙ Manage</button>`;
  nav.innerHTML = html;
}

function setTab(id) { activeTab=id; render(); }

function renderContent() {
  const el = document.getElementById('tab-content');
  if (activeTab==='overview')  el.innerHTML = renderOverview();
  else if (activeTab==='__manage') el.innerHTML = renderManage();
  else {
    const a = attorneys[activeTab];
    if (!a) { el.innerHTML=''; return; }
    el.innerHTML = renderAttorneyTab(activeTab, a);
  }
}

// ── OVERVIEW ──────────────────────────────────────────────────
function renderOverview() {
  const today=todayISO(), week=weekISO();
  let overdue=0, upcoming=0;
  Object.values(tasks).forEach(t => {
    if (t.completed||t.isOngoing||!t.dueDate) return;
    if (t.dueDate<today) overdue++;
    else if (t.dueDate<=week) upcoming++;
  });

  let html = `<div class="stats-grid">
    <div class="stat-card stat-primary"><div class="stat-val">${Object.keys(attorneys).length}</div><div class="stat-lbl">Attorneys</div></div>
    <div class="stat-card stat-primary"><div class="stat-val">${Object.keys(matters).length}</div><div class="stat-lbl">Active Matters</div></div>
    <div class="stat-card stat-overdue"><div class="stat-val">${overdue}</div><div class="stat-lbl">Overdue Tasks</div></div>
    <div class="stat-card stat-upcoming"><div class="stat-val">${upcoming}</div><div class="stat-val stat-lbl">Due This Week</div></div>
  </div><h2 style="font-size:.9rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px">Attorneys at a Glance</h2>`;

  for (const [aId, a] of sortedAttorneys()) {
    const aMatters = mattersFor(aId);
    let aOverdue=0, aUpcoming=0;
    aMatters.forEach(([mid])=>tasksFor(mid).forEach(([,t])=>{
      if(t.completed||t.isOngoing||!t.dueDate) return;
      if(t.dueDate<today) aOverdue++; else if(t.dueDate<=week) aUpcoming++;
    }));
    let badges = aOverdue ? `<span class="badge badge-overdue">${aOverdue} overdue</span>` : '';
    badges += aUpcoming ? `<span class="badge badge-upcoming">${aUpcoming} due soon</span>` : '';
    if (!aOverdue&&!aUpcoming) badges = `<span class="badge badge-ok">On track</span>`;

    html += `<div class="overview-card">
      <div class="overview-card-hdr" onclick="setTab('${aId}')">
        <h3>${esc(a.name)}</h3><div class="badge-row">${badges}</div>
      </div>
      <div class="overview-matters">`;

    if (!aMatters.length) { html += `<div class="ov-row"><span class="ov-meta">No matters yet</span></div>`; }
    for (const [mid, m] of aMatters) {
      const mTasks = tasksFor(mid);
      const total = mTasks.filter(([,t])=>!t.isOngoing).length;
      const done  = mTasks.filter(([,t])=>t.completed).length;
      const mOver = mTasks.filter(([,t])=>!t.completed&&!t.isOngoing&&t.dueDate&&t.dueDate<today).length;
      const others = (m.attorneyIds||[]).filter(id=>id!==aId).map(id=>attorneys[id]?.name).filter(Boolean);
      html += `<div class="ov-row">
        <span class="ov-name">${esc(m.name)}</span>
        <span class="ov-meta">${done}/${total} done${mOver?` · <span style="color:var(--danger)">${mOver} overdue</span>`:''}</span>
        ${others.length?`<span class="ov-also">also: ${esc(others.join(', '))}</span>`:''}
      </div>`;
    }
    html += `</div></div>`;
  }
  return html;
}

// ── ATTORNEY TAB ──────────────────────────────────────────────
function renderAttorneyTab(aId, a) {
  const today=todayISO(), week=weekISO();
  let html = `<div class="atty-hdr"><h2>${esc(a.name)}</h2>
    <button class="btn btn-primary" onclick="openAddMatter('${aId}')">+ Add Matter</button></div>`;

  const aMatters = mattersFor(aId);
  if (!aMatters.length) return html + `<div class="empty-state">No matters yet. Click "+ Add Matter" to get started.</div>`;

  for (const [mId, m] of aMatters) {
    const others = (m.attorneyIds||[]).filter(id=>id!==aId).map(id=>attorneys[id]?.name).filter(Boolean);
    html += `<div class="matter-card">
      <div class="matter-hdr">
        <span class="matter-name">${esc(m.name)}</span>
        ${others.length?`<span class="matter-also">also: ${esc(others.join(', '))}</span>`:''}
        <div class="matter-actions">
          <button class="btn btn-ghost btn-sm" onclick="openEditMatter('${mId}','${aId}')">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="confirmDel('matter','${mId}','${esc(m.name)}')">Delete</button>
        </div>
      </div>
      <table class="task-table">
        <thead><tr><th style="width:26px"></th><th>Task</th><th style="width:105px">Due</th><th style="width:105px">Status</th><th>Notes</th><th style="width:72px"></th></tr></thead>
        <tbody>`;

    const mTasks = tasksFor(mId);
    const ongoing = mTasks.filter(([,t])=>t.isOngoing);
    const active  = mTasks.filter(([,t])=>!t.isOngoing&&!t.completed)
                          .sort((a,b)=>{ if(!a[1].dueDate&&!b[1].dueDate) return 0; if(!a[1].dueDate) return 1; if(!b[1].dueDate) return -1; return a[1].dueDate.localeCompare(b[1].dueDate); });
    const done    = mTasks.filter(([,t])=>t.completed);

    for (const [tId, t] of [...ongoing,...active]) html += taskRow(tId, t, today, week);

    if (done.length) {
      html += `</tbody></table><div class="done-divider">✓ Completed (${done.length})</div>
        <table class="task-table"><tbody>`;
      for (const [tId, t] of done) html += taskRow(tId, t, today, week);
    }

    html += `</tbody></table>
      <div style="padding:8px 12px">
        <button class="add-task-btn" onclick="openAddTask('${mId}')">+ Add Task</button>
      </div></div>`;
  }
  return html;
}

function taskRow(tId, t, today, week) {
  const dc = taskDateClass(t);
  const rowCls = t.completed ? 'task-row is-done' : 'task-row';

  let ctrl='', dateCell='', statusCell='';
  if (t.isOngoing) {
    ctrl = `<span class="ongoing-pill">↻</span>`;
    dateCell = `<td class="task-date">—</td>`;
    statusCell = `<td><span class="ongoing-pill">Ongoing</span></td>`;
  } else if (t.completed) {
    ctrl = `<input type="checkbox" class="task-checkbox" checked onchange="toggleTask('${tId}',false)">`;
    dateCell = `<td class="task-date done-date">${t.completedDate?fmtDate(t.completedDate):'Done'}</td>`;
    statusCell = `<td><span class="done-pill">✓ Complete</span></td>`;
  } else {
    ctrl = `<input type="checkbox" class="task-checkbox" onchange="toggleTask('${tId}',true)">`;
    dateCell = t.dueDate
      ? `<td class="task-date ${dc}">${dc==='overdue'?'⚠ ':''}${fmtDate(t.dueDate)}</td>`
      : `<td class="task-date">—</td>`;
    statusCell = dc==='overdue' ? `<td><span class="badge badge-overdue">Overdue</span></td>`
               : dc==='upcoming' ? `<td><span class="badge badge-upcoming">Due Soon</span></td>`
               : `<td></td>`;
  }

  return `<tr class="${rowCls}">
    <td>${ctrl}</td>
    <td class="task-desc">${esc(t.description)}</td>
    ${dateCell}${statusCell}
    <td class="task-notes">${esc(t.notes||'')}</td>
    <td class="task-actions">
      <button class="icon-btn" onclick="openEditTask('${tId}')" title="Edit">✎</button>
      <button class="icon-btn del" onclick="confirmDel('task','${tId}','${esc(t.description)}')" title="Delete">✕</button>
    </td>
  </tr>`;
}

// ── MANAGE TAB ────────────────────────────────────────────────
function renderManage() {
  let html = `<div style="max-width:560px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <h2 style="font-size:1.05rem;font-weight:700">Manage Attorneys</h2>
      <button class="btn btn-primary" onclick="openAddAttorney()">+ Add Attorney</button>
    </div>
    <div style="background:var(--surface);border-radius:10px;border:1px solid var(--border);overflow:hidden">`;
  const list = sortedAttorneys();
  if (!list.length) html += `<div class="empty-state">No attorneys yet.</div>`;
  for (const [id, a] of list) {
    const mc = mattersFor(id).length;
    html += `<div class="manage-row">
      <span style="flex:1;font-weight:500">${esc(a.name)}</span>
      <span style="color:var(--muted);font-size:.8rem;margin-right:14px">${mc} matter${mc!==1?'s':''}</span>
      <div style="display:flex;gap:6px">
        <button class="btn btn-ghost btn-sm" onclick="openEditAttorney('${id}')">Edit</button>
        <button class="btn btn-danger btn-sm" onclick="confirmDel('attorney','${id}','${esc(a.name)}')">Delete</button>
      </div>
    </div>`;
  }
  return html + '</div></div>';
}

// ── CRUD: TASK ────────────────────────────────────────────────
async function toggleTask(id, completed) {
  await db.collection('tasks').doc(id).update({ completed, completedDate: completed ? todayISO() : null });
}

let _taskMatter=null, _taskEdit=null;
function openAddTask(mId) {
  _taskMatter=mId; _taskEdit=null;
  document.getElementById('mtask-title').textContent='Add Task';
  ['mtask-desc','mtask-date','mtask-notes'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('mtask-ongoing').checked=false;
  document.getElementById('modal-task').classList.remove('hidden');
  document.getElementById('mtask-desc').focus();
}
function openEditTask(id) {
  _taskEdit=id; _taskMatter=null;
  const t=tasks[id];
  document.getElementById('mtask-title').textContent='Edit Task';
  document.getElementById('mtask-desc').value=t.description||'';
  document.getElementById('mtask-date').value=t.dueDate||'';
  document.getElementById('mtask-notes').value=t.notes||'';
  document.getElementById('mtask-ongoing').checked=!!t.isOngoing;
  document.getElementById('modal-task').classList.remove('hidden');
  document.getElementById('mtask-desc').focus();
}
document.getElementById('mtask-save').onclick = async () => {
  const desc=document.getElementById('mtask-desc').value.trim(); if(!desc) return;
  const dueDate=document.getElementById('mtask-date').value||null;
  const notes=document.getElementById('mtask-notes').value.trim();
  const isOngoing=document.getElementById('mtask-ongoing').checked;
  if (_taskEdit) {
    await db.collection('tasks').doc(_taskEdit).update({ description:desc, dueDate, notes, isOngoing });
  } else {
    const existing = Object.values(tasks).filter(t=>t.matterId===_taskMatter);
    const order = existing.length ? Math.max(...existing.map(t=>t.order??0))+1 : 0;
    await db.collection('tasks').doc().set({ matterId:_taskMatter, description:desc, dueDate, notes, isOngoing, completed:false, completedDate:null, order });
  }
  closeModal('modal-task');
};

// ── CRUD: MATTER ──────────────────────────────────────────────
let _matterPrimary=null, _matterEdit=null;
function openAddMatter(aId) {
  _matterPrimary=aId; _matterEdit=null;
  document.getElementById('mmatter-title').textContent='Add Matter';
  document.getElementById('mmatter-name').value='';
  populateMatterAttys(aId, []);
  document.getElementById('modal-matter').classList.remove('hidden');
  document.getElementById('mmatter-name').focus();
}
function openEditMatter(mId, viewingAs) {
  _matterEdit=mId; _matterPrimary=viewingAs;
  const m=matters[mId];
  document.getElementById('mmatter-title').textContent='Edit Matter';
  document.getElementById('mmatter-name').value=m.name||'';
  populateMatterAttys(viewingAs, m.attorneyIds||[]);
  document.getElementById('modal-matter').classList.remove('hidden');
  document.getElementById('mmatter-name').focus();
}
function populateMatterAttys(primaryId, selected) {
  const c=document.getElementById('mmatter-attys'); c.innerHTML='';
  const others = sortedAttorneys().filter(([id])=>id!==primaryId);
  if (!others.length) { c.innerHTML='<span style="color:var(--muted);font-size:.82rem">No other attorneys to share with.</span>'; return; }
  others.forEach(([id,a]) => {
    c.innerHTML += `<label class="check-row"><input type="checkbox" value="${id}" ${selected.includes(id)?'checked':''}> ${esc(a.name)}</label>`;
  });
}
document.getElementById('mmatter-save').onclick = async () => {
  const name=document.getElementById('mmatter-name').value.trim(); if(!name) return;
  const extra=[...document.querySelectorAll('#mmatter-attys input:checked')].map(i=>i.value);
  const aIds=[...(new Set([_matterPrimary,...extra]))].filter(Boolean);
  if (_matterEdit) {
    await db.collection('matters').doc(_matterEdit).update({ name, attorneyIds:aIds });
  } else {
    const order=Object.keys(matters).length ? Math.max(...Object.values(matters).map(m=>m.order??0))+1 : 0;
    await db.collection('matters').doc().set({ name, attorneyIds:aIds, order });
  }
  closeModal('modal-matter');
};

// ── CRUD: ATTORNEY ────────────────────────────────────────────
let _attyEdit=null;
function openAddAttorney() {

  document.getElementById('matty-name').value='';

// ── DELETE ────────────────────────────────────────────────────
let _del=null;
function confirmDel(type, id, label) {
  _del={type,id};
  const msgs={
    attorney:`Remove "${label}"? Their matters stay in the system but won't be linked to them.`,
    matter:`Delete "${label}" and all its tasks? This cannot be undone.`,
    task:`Delete task "${label}"?`
  };
  document.getElementById('mconfirm-title').textContent=`Delete ${type}?`;
  document.getElementById('mconfirm-msg').textContent=msgs[type]||'';
  document.getElementById('modal-confirm').classList.remove('hidden');
}
document.getElementById('mconfirm-ok').onclick = async () => {
  if (!_del) return;
  const {type,id}=_del;
  if (type==='attorney') {
    const batch=db.batch();
    batch.delete(db.collection('attorneys').doc(id));
    Object.entries(matters).forEach(([mid,m])=>{
      if (m.attorneyIds?.includes(id))
        batch.update(db.collection('matters').doc(mid),{attorneyIds:m.attorneyIds.filter(x=>x!==id)});
    });
    await batch.commit();
    if (activeTab===id) setTab('overview');
  } else if (type==='matter') {
    const batch=db.batch();
    batch.delete(db.collection('matters').doc(id));
    Object.entries(tasks).filter(([,t])=>t.matterId===id).forEach(([tid])=>batch.delete(db.collection('tasks').doc(tid)));
    await batch.commit();
  } else if (type==='task') {
    await db.collection('tasks').doc(id).delete();
  }
  _del=null; closeModal('modal-confirm');
};

// Enter key in modal inputs
document.getElementById('matty-name').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('matty-save').click(); });
document.getElementById('mmatter-name').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('mmatter-save').click(); });
document.getElementById('mtask-desc').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('mtask-save').click(); });</script>
